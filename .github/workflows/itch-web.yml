# Prueba la versión web de FASE y, si va bien, la sube a itch.io cuando se publica una release
# con el archivo FASE-web.zip.
#
# Cómo usarlo:
#   1. En Unity: menú Fase → Exportar web (genera Builds/Web).
#   2. Comprimir Builds/Web en Builds/FASE-web.zip (rutas con "/").
#   3. gh release create web-AAAAMMDD-N Builds/FASE-web.zip --target fase --title "Web ..."
#
# Usa los mismos ajustes del repo que la plantilla de Godot:
#   Secret   BUTLER_API_KEY   clave de API de itch.io
#   Variable ITCH_USER        usuario de itch.io
#   Variable ITCH_GAME        parte final de la URL del juego
# Unity no se instala aquí: la exportación se hace en el PC y aquí solo se sube.

name: Subir web a itch

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release con el FASE-web.zip"
        required: true

jobs:
  probar:
    # Antes de subir: abre la web en un Chrome sin ventana, pasa el inicio, entra a jugar y pulsa
    # unas teclas. Si hay errores o la imagen no se mueve, no se sube a itch. Las capturas quedan
    # como artefacto del run.
    if: startsWith(github.event.release.tag_name || inputs.tag, 'web-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Tools/prueba_web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar FASE-web.zip de la release
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern FASE-web.zip
          mkdir web && unzip -q FASE-web.zip -d web
      - name: Preparar Chrome
        working-directory: Tools/prueba_web
        run: |
          npm install --no-audit --no-fund
          # Google Chrome (no el Chromium de Playwright): trae los códecs de audio que usa Unity en la web.
          npx playwright install --with-deps chrome
      - name: Probar la web
        working-directory: Tools/prueba_web
        run: |
          (cd "$GITHUB_WORKSPACE/web" && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          CHROME=chrome node prueba.mjs http://localhost:8000/ capturas
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ env.TAG }}
          path: Tools/prueba_web/capturas

  upload:
    needs: probar
    # Solo las releases de la web (web-AAAAMMDD-N); las versiones del juego (v1.0...) no tocan itch.
    if: startsWith(github.event.release.tag_name || inputs.tag, 'web-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Descargar FASE-web.zip de la release
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern FASE-web.zip
          mkdir web && unzip -q FASE-web.zip -d web
          test -f web/index.html
          ls -la web web/Build

      - name: Subir a itch.io (canal html5)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_USER }}/${{ vars.ITCH_GAME }}
        run: |
          curl -fsSL -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q /tmp/butler.zip -d ~/butler
          chmod +x ~/butler/butler
          ~/butler/butler push web "$ITCH_TARGET:html5" --userversion "$TAG"
          sleep 30
          ~/butler/butler status "$ITCH_TARGET"
