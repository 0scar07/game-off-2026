# Cada push a main: pasa el test, exporta web, Windows y Android y, si está configurado, lo sube a itch.io.
#
# Configuración (GitHub → Settings → Secrets and variables → Actions):
#   Secret   BUTLER_API_KEY         clave de API de itch.io (https://itch.io/user/settings/api-keys)
#   Variable ITCH_USER              tu usuario de itch.io
#   Variable ITCH_GAME              la parte final de la URL del juego (usuario.itch.io/<ITCH_GAME>)
#   Secret   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD  (opcional, ver GUIA.md)
# Sin ellos, las versiones se pueden descargar igualmente desde la pestaña Actions (Artifacts).

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable
  GODOT_TEMPLATES_DIR: 4.7.2.stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_ITCH: ${{ secrets.BUTLER_API_KEY != '' && vars.ITCH_USER != '' && vars.ITCH_GAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar Godot de la caché
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-v1

      - name: Descargar Godot y las plantillas de exportación
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          # Las plantillas pesan más de 1 GB: solo se extraen las de web, Windows y Android.
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz \
            'templates/version.txt' \
            'templates/web_nothreads_*' \
            'templates/windows_*x86_64*' \
            'templates/android_*' \
            -d "$dest"
          ls -la "$dest"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Configurar Godot
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          # Rutas del SDK de Android y de Java del runner, para exportar el APK.
          mkdir -p ~/.config/godot
          for file in editor_settings-4.7.tres; do
            cat > ~/.config/godot/$file <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          EOF
          done

      - name: Importar el proyecto
        run: godot --headless --path . --import

      - name: Test automático
        run: godot --headless --path . res://tests/smoke_test.tscn

      - name: Exportar web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html

      - name: Exportar Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/GameOff2026.exe
          test -f build/windows/GameOff2026.exe

      - name: Exportar Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/android
          keystore="$RUNNER_TEMP/release.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
            password="$ANDROID_KEYSTORE_PASSWORD"
          else
            # Sin keystore propio se crea uno temporal: el APK funciona, pero para
            # instalar una versión nueva hay que desinstalar antes la anterior.
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: el APK se firma con una clave temporal."
            password="temporal-$(openssl rand -hex 8)"
            keytool -genkeypair -keystore "$keystore" -alias gameoff -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$password" -keypass "$password" -dname "CN=Game Off 2026"
          fi
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=gameoff
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$password"
          godot --headless --path . --export-release "Android" build/android/GameOff2026.apk
          test -f build/android/GameOff2026.apk

      - name: Guardar las versiones (pestaña Actions → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: build/
          retention-days: 14

      - name: Subir a itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_USER }}/${{ vars.ITCH_GAME }}
        if: env.HAS_ITCH == 'true'
        run: |
          curl -fsSL -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q /tmp/butler.zip -d ~/butler
          chmod +x ~/butler/butler
          version="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          ~/butler/butler push build/web "$ITCH_TARGET:html5" --userversion "$version"
          ~/butler/butler push build/windows "$ITCH_TARGET:windows" --userversion "$version"
          ~/butler/butler push build/android "$ITCH_TARGET:android" --userversion "$version"
