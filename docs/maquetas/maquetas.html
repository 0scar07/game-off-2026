<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>FASE maquetas</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// Maquetas de FASE pintadas a mano en canvas. ?s=1..5 elige la escena.
const W = 1280, H = 720;
const c = document.getElementById('c'), g = c.getContext('2d');
const params = new URLSearchParams(location.search);
const scene = +(params.get('s') || 1);
// ?k=1.5 pinta a 1920×1080 con las mismas coordenadas de 1280×720.
const K = +(params.get('k') || 1);
c.width = W * K; c.height = H * K; g.scale(K, K);
let seed = 7;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a, b) => a + (b - a) * rnd();
const FONT = '"Trebuchet MS", "Segoe UI", sans-serif';

function lin(x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => gr.addColorStop(o, col)); return gr; }
function rad(x, y, r, stops) { const gr = g.createRadialGradient(x, y, 0, x, y, r); stops.forEach(([o, col]) => gr.addColorStop(o, col)); return gr; }
function rect(x, y, w, h, fill) { g.fillStyle = fill; g.fillRect(x, y, w, h); }
function poly(pts, fill) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); pts.slice(1).forEach(p => g.lineTo(p[0], p[1])); g.closePath(); g.fillStyle = fill; g.fill(); }
function glow(x, y, r, col, a = 1) { g.save(); g.globalAlpha = a; g.globalCompositeOperation = 'lighter'; g.fillStyle = rad(x, y, r, [[0, col], [0.35, col.replace(/[\d.]+\)$/, '0.35)')], [1, col.replace(/[\d.]+\)$/, '0)')]]); g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore(); }
function circle(x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = fill; g.fill(); }
function clipX(x0, x1, fn) { g.save(); g.beginPath(); g.rect(x0, 0, x1 - x0, H); g.clip(); fn(); g.restore(); }

// ───── Paisaje ─────
const PAL = {
  day: { sky: ['#5fb4f0', '#a9dcf7', '#fff1d2'], hill: ['#8fd6a8', '#6cbf8c', '#4fa775'], haze: 'rgba(255,244,214,', grass: '#5ccf6d', grassDark: '#3fa857', dirt: '#d98654', dirtDark: '#b0623d', leaf: ['#62e0b8', '#3fc49b'], trunk: '#c98a5a' },
  night: { sky: ['#05051a', '#141142', '#2a1d5e'], hill: ['#24245e', '#1c1b4d', '#14133a'], haze: 'rgba(90,90,200,', grass: '#2f8d84', grassDark: '#236f6b', dirt: '#5a4467', dirtDark: '#3f2f4f', leaf: ['#4a7dff', '#355de0'], trunk: '#4b3a66' },
  autumn: { sky: ['#f39a5a', '#ffc98a', '#fff0c8'], hill: ['#e8a465', '#cc7e4a', '#a85d3a'], haze: 'rgba(255,220,170,', grass: '#e09a3a', grassDark: '#b87628', dirt: '#8a5a3a', dirtDark: '#6a4028', leaf: ['#ff7a3d', '#e2552e'], trunk: '#7a4a2e' },
  autumnNight: { sky: ['#0b0614', '#2a0f2a', '#5a1f3a'], hill: ['#3a1a3a', '#2a1230', '#1c0b24'], haze: 'rgba(200,90,140,', grass: '#7a3a5a', grassDark: '#5a2846', dirt: '#3a2030', dirtDark: '#28141f', leaf: ['#b0306a', '#8a1f55'], trunk: '#3a1f2f' },
  snow: { sky: ['#8fd0ff', '#d6efff', '#ffffff'], hill: ['#cfe6ff', '#b4d4f4', '#9cc0e8'], haze: 'rgba(255,255,255,', grass: '#ffffff', grassDark: '#dbe9f7', dirt: '#9db8d6', dirtDark: '#7f9bbd', leaf: ['#8fc4b0', '#6da896'], trunk: '#7a6a72' },
  snowNight: { sky: ['#010614', '#06163a', '#0c2a5a'], hill: ['#0e2a55', '#0a1f44', '#071633'], haze: 'rgba(80,200,255,', grass: '#bfe6ff', grassDark: '#7fb8e6', dirt: '#1d3a63', dirtDark: '#12284a', leaf: ['#59e1ff', '#2fb6e6'], trunk: '#21365a' },
};

function sky(p, sunX, sunY, night) {
  rect(0, 0, W, H, lin(0, 0, 0, H, [[0, p.sky[0]], [0.6, p.sky[1]], [1, p.sky[2]]]));
  if (night) {
    seed = 11;
    for (let i = 0; i < 260; i++) { const x = R(0, W), y = R(0, H * 0.75), s = R(0.5, 1.8); circle(x, y, s, `rgba(255,255,255,${R(0.3, 1)})`); if (s > 1.5) glow(x, y, 8, 'rgba(180,200,255,0.8)', 0.6); }
    g.save(); g.globalAlpha = 0.18; g.fillStyle = lin(0, 0, W, H, [[0, 'rgba(120,90,255,0)'], [0.5, 'rgba(200,120,255,1)'], [1, 'rgba(80,160,255,0)']]);
    g.beginPath(); g.moveTo(0, 260); g.bezierCurveTo(400, 120, 800, 320, W, 100); g.lineTo(W, 200); g.bezierCurveTo(800, 420, 400, 220, 0, 360); g.fill(); g.restore();
    glow(sunX, sunY, 260, 'rgba(150,170,255,0.5)');
    circle(sunX, sunY, 58, '#eef2ff'); circle(sunX - 16, sunY - 10, 12, 'rgba(180,190,230,0.6)'); circle(sunX + 18, sunY + 14, 8, 'rgba(180,190,230,0.5)');
  } else {
    glow(sunX, sunY, 420, 'rgba(255,240,200,0.9)');
    circle(sunX, sunY, 70, '#fffbe8');
    g.save(); g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 9; i++) { const a = -0.2 + i * 0.12; g.fillStyle = 'rgba(255,240,200,0.05)'; g.beginPath(); g.moveTo(sunX, sunY); g.lineTo(sunX + Math.cos(a + 1.2) * 1600, sunY + Math.sin(a + 1.2) * 1600); g.lineTo(sunX + Math.cos(a + 1.26) * 1600, sunY + Math.sin(a + 1.26) * 1600); g.fill(); }
    g.restore();
    seed = 5;
    for (let i = 0; i < 6; i++) { const cx = R(0, W); if (Math.abs(cx - sunX) > 220) cloud(cx, R(60, 260), R(0.6, 1.3)); }
  }
}

function cloud(x, y, s) { g.save(); g.globalAlpha = 0.85; [[0, 0, 40], [38, -14, 46], [80, 0, 38], [40, 12, 42]].forEach(([dx, dy, r]) => circle(x + dx * s, y + dy * s, r * s, 'rgba(255,255,255,0.9)')); g.restore(); }

function hills(p, baseY, layers = 3, sd = 3) {
  seed = sd;
  for (let l = 0; l < layers; l++) {
    const y0 = baseY + l * 55, amp = 70 - l * 15;
    const pts = [[0, H]]; for (let x = 0; x <= W; x += 40) pts.push([x, y0 - Math.sin(x / 180 + l * 2) * amp * 0.5 - R(0, amp * 0.5)]); pts.push([W, H]);
    poly(pts, lin(0, y0 - amp, 0, H, [[0, p.hill[l]], [1, p.hill[Math.min(l + 1, 2)]]]));
    if (l < layers - 1) for (let x = R(0, 60); x < W; x += R(50, 110)) tree(x, y0 - R(0, amp * 0.3) + 10, R(40, 70) * (0.5 + l * 0.25), p, l === 0 ? 0.55 : 0.8);
    rect(0, y0 - amp, W, H, lin(0, y0 - amp, 0, H, [[0, p.haze + '0)'], [1, p.haze + (0.35 - l * 0.1) + ')']]));
  }
}

function tree(x, baseY, h, p, alpha = 1, pine = false) {
  g.save(); g.globalAlpha = alpha;
  rect(x - h * 0.06, baseY - h * 0.45, h * 0.12, h * 0.45, p.trunk);
  if (pine || p === PAL.night || p === PAL.snowNight || p === PAL.snow) {
    for (let i = 0; i < 4; i++) { const w = h * (0.42 - i * 0.08), y = baseY - h * 0.3 - i * h * 0.17; poly([[x - w, y], [x, y - h * 0.28], [x + w, y]], i % 2 ? p.leaf[1] : p.leaf[0]); poly([[x, y], [x, y - h * 0.28], [x + w, y]], 'rgba(0,0,0,0.12)'); }
  } else {
    const cy = baseY - h * 0.7;
    poly([[x - h * 0.34, cy + h * 0.15], [x - h * 0.4, cy - h * 0.12], [x - h * 0.12, cy - h * 0.36], [x + h * 0.2, cy - h * 0.34], [x + h * 0.4, cy - h * 0.08], [x + h * 0.32, cy + h * 0.18], [x, cy + h * 0.26]], p.leaf[0]);
    poly([[x, cy - h * 0.35], [x + h * 0.2, cy - h * 0.34], [x + h * 0.4, cy - h * 0.08], [x + h * 0.32, cy + h * 0.18], [x, cy + h * 0.26]], p.leaf[1]);
    poly([[x - h * 0.3, cy - h * 0.05], [x - h * 0.12, cy - h * 0.3], [x - h * 0.02, cy - h * 0.2]], 'rgba(255,255,255,0.18)');
  }
  g.restore();
}

function ground(p, x0, x1, top, depth = 300, tile = 64) {
  for (let x = x0; x < x1; x += tile) {
    const w = Math.min(tile, x1 - x);
    rect(x, top + 14, w, depth, lin(0, top, 0, top + depth, [[0, p.dirt], [1, p.dirtDark]]));
    rect(x + w - 3, top + 14, 3, depth, 'rgba(0,0,0,0.12)');
    g.save(); g.fillStyle = p.grass; g.beginPath(); g.roundRect(x - 1, top - 4, w + 2, 26, 10); g.fill();
    g.fillStyle = p.grassDark; g.fillRect(x, top + 14, w, 8); g.restore();
    for (let i = 0; i < 3; i++) { const gx = x + R(4, w - 4); poly([[gx - 4, top], [gx, top - R(8, 16)], [gx + 4, top]], p.grass); }
  }
  rect(x0, top + 22, x1 - x0, 50, lin(0, top + 22, 0, top + 72, [[0, 'rgba(0,0,0,0.18)'], [1, 'rgba(0,0,0,0)']]));
}

function bridge(x0, x1, top) {
  for (let x = x0; x < x1; x += 34) { rect(x, top, 30, 16, '#d9a06a'); rect(x, top + 12, 30, 4, '#a8703f'); }
  rect(x0, top - 30, x1 - x0, 5, '#c98a5a'); for (let x = x0; x <= x1; x += 68) rect(x - 3, top - 30, 6, 46, '#a8703f');
}

function iceSlab(x, y, w, h = 22, col = 'rgba(120,180,255,') {
  glow(x + w / 2, y + h / 2, w * 0.9, col + '0.6)', 0.55);
  g.save(); g.fillStyle = lin(0, y, 0, y + h, [[0, '#cfe8ff'], [1, '#6f8dff']]); g.beginPath(); g.roundRect(x, y, w, h, 6); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.7)'; g.fillRect(x + 6, y + 3, w * 0.5, 3); g.restore();
}

// ───── Personajes ─────
function lumi(x, y, s, night, facing = 1) {
  g.save(); g.translate(x, y); g.scale(s * facing, s);
  g.fillStyle = 'rgba(0,0,0,0.22)'; g.beginPath(); g.ellipse(0, 62, 34, 7, 0, 0, 7); g.fill();
  // bufanda al viento
  g.fillStyle = '#ff7a3d'; g.beginPath(); g.moveTo(-6, 18); g.bezierCurveTo(-40, 14, -62, 30, -86, 18); g.lineTo(-82, 32); g.bezierCurveTo(-60, 42, -36, 28, -6, 32); g.fill();
  g.fillStyle = '#e8592a'; g.beginPath(); g.moveTo(-60, 30); g.lineTo(-86, 18); g.lineTo(-82, 32); g.fill();
  rect(-16, 40, 12, 22, '#9a7ae0'); rect(6, 40, 12, 22, '#9a7ae0');
  g.fillStyle = '#f2f2fa'; g.beginPath(); g.ellipse(-14, -50, 9, 24, -0.25, 0, 7); g.fill(); g.beginPath(); g.ellipse(12, -52, 9, 24, 0.2, 0, 7); g.fill();
  g.fillStyle = '#ffb08a'; g.beginPath(); g.ellipse(-14, -48, 4, 15, -0.25, 0, 7); g.fill(); g.beginPath(); g.ellipse(12, -50, 4, 15, 0.2, 0, 7); g.fill();
  g.fillStyle = lin(-40, -40, 40, 40, [[0, '#ffffff'], [1, '#d9dbea']]); g.beginPath(); g.arc(0, 0, 40, 0, 7); g.fill();
  g.fillStyle = '#22223a'; g.beginPath(); g.ellipse(14, 2, 24, 20, 0, 0, 7); g.fill();
  circle(8, 0, 6, night ? '#9fe7ff' : '#7fd3ff'); circle(24, 0, 6, night ? '#9fe7ff' : '#7fd3ff'); circle(10, -2, 2, '#fff'); circle(26, -2, 2, '#fff');
  g.fillStyle = 'rgba(255,255,255,0.8)'; g.beginPath(); g.ellipse(-16, -20, 10, 6, -0.6, 0, 7); g.fill();
  g.fillStyle = '#ff7a3d'; g.beginPath(); g.roundRect(-34, 22, 68, 16, 8); g.fill();
  // farol
  g.strokeStyle = '#6a5a7a'; g.lineWidth = 3; g.beginPath(); g.moveTo(34, 20); g.lineTo(52, 30); g.stroke();
  g.fillStyle = '#4a3a5a'; g.fillRect(46, 30, 14, 22);
  g.fillStyle = night ? '#ffe28a' : '#fff1c4'; g.fillRect(48, 33, 10, 15);
  g.restore();
  if (night) { glow(x + 53 * s * facing, y + 40 * s, 160 * s, 'rgba(255,210,120,0.75)'); glow(x + 53 * s * facing, y + 40 * s, 40 * s, 'rgba(255,240,200,1)'); }
}

function creature(x, y, s, stone) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(0, 70, 46, 8, 0, 0, 7); g.fill();
  if (stone) {
    poly([[-44, 70], [-50, 20], [-30, -30], [0, -46], [32, -30], [50, 18], [44, 70]], '#9a948c');
    poly([[0, -46], [32, -30], [50, 18], [44, 70], [0, 70]], '#7f7a73');
    g.strokeStyle = '#5f5a54'; g.lineWidth = 3; g.beginPath(); g.moveTo(-10, -20); g.lineTo(4, 6); g.lineTo(-6, 30); g.stroke();
    rect(-20, -4, 12, 4, '#5f5a54'); rect(8, -4, 12, 4, '#5f5a54');
    poly([[-30, -30], [-20, -46], [-12, -36]], '#7fae6a'); poly([[16, -40], [26, -52], [30, -34]], '#7fae6a');
  } else {
    glow(0, 10, 150, 'rgba(160,60,255,0.45)');
    g.fillStyle = lin(0, -60, 0, 70, [[0, '#3a2a8a'], [1, '#120a33']]);
    g.beginPath(); g.moveTo(-46, 70); g.bezierCurveTo(-60, 0, -40, -58, 0, -58); g.bezierCurveTo(40, -58, 60, 0, 46, 70);
    for (let i = 0; i < 6; i++) g.lineTo(46 - i * 18.4 - 9, 54), g.lineTo(46 - (i + 1) * 18.4, 70); g.fill();
    poly([[-30, -40], [-44, -74], [-16, -50]], '#2a1f6a'); poly([[30, -40], [44, -74], [16, -50]], '#2a1f6a');
    [[-16, -6], [16, -6]].forEach(([ex, ey]) => { glow(ex, ey, 34, 'rgba(255,60,140,0.9)'); circle(ex, ey, 9, '#ff4d8a'); circle(ex + 2, ey - 2, 3, '#fff'); });
    g.strokeStyle = '#ff4d8a'; g.lineWidth = 3; g.beginPath(); g.arc(0, 14, 14, 0.2, Math.PI - 0.2); g.stroke();
  }
  g.restore();
}

function moonShard(x, y, s) { glow(x, y, 70 * s, 'rgba(255,220,130,0.8)'); g.save(); g.translate(x, y); g.rotate(0.3); poly([[0, -22 * s], [14 * s, 0], [0, 22 * s], [-10 * s, 4 * s]], '#fff2b0'); poly([[0, -22 * s], [14 * s, 0], [0, 22 * s]], '#ffd76a'); g.restore(); }

function fireflies(x0, x1, y0, y1, n, col = 'rgba(255,240,140,1)') { for (let i = 0; i < n; i++) { const x = R(x0, x1), y = R(y0, y1); glow(x, y, R(10, 22), col, 0.9); circle(x, y, 2, '#fffbe0'); } }
function pollen(x0, x1, y0, y1, n) { for (let i = 0; i < n; i++) circle(R(x0, x1), R(y0, y1), R(1, 3), `rgba(255,255,230,${R(0.3, 0.8)})`); }
function butterfly(x, y, col) { g.save(); g.translate(x, y); poly([[0, 0], [-12, -10], [-14, 4]], col); poly([[0, 0], [12, -12], [14, 4]], col); rect(-1, -6, 2, 10, '#40303a'); g.restore(); }

function lineBeam(x) {
  g.save(); g.globalCompositeOperation = 'lighter';
  rect(x - 60, 0, 120, H, lin(x - 60, 0, x + 60, 0, [[0, 'rgba(255,220,160,0)'], [0.45, 'rgba(255,230,180,0.18)'], [0.5, 'rgba(255,255,255,0.9)'], [0.55, 'rgba(140,170,255,0.25)'], [1, 'rgba(120,150,255,0)']]));
  g.restore(); rect(x - 2, 0, 4, H, '#ffffff');
  seed = 99; for (let i = 0; i < 40; i++) { const y = R(0, H), dx = R(-26, 26); glow(x + dx, y, R(6, 14), dx < 0 ? 'rgba(255,220,150,1)' : 'rgba(150,190,255,1)', 0.9); }
  glow(x, H * 0.55, 90, 'rgba(255,255,255,0.6)', 0.6);
}

function vignette(a = 0.55) { rect(0, 0, W, H, rad(W / 2, H / 2, W * 0.75, [[0.55, 'rgba(0,0,0,0)'], [1, `rgba(0,0,10,${a})`]])); }
function bloomPass() { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.filter = `blur(${18 * K}px) brightness(1.15)`; g.globalAlpha = 0.28; g.globalCompositeOperation = 'screen'; g.drawImage(c, 0, 0); g.restore(); }
function grade(col, a) { g.save(); g.globalCompositeOperation = 'soft-light'; g.globalAlpha = a; rect(0, 0, W, H, col); g.restore(); }

function text(t, x, y, size, col = '#fff', align = 'left', weight = '700', shadow = true) {
  g.save(); g.font = `${weight} ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle';
  if (shadow) { g.shadowColor = 'rgba(0,0,30,0.6)'; g.shadowBlur = size * 0.3; g.shadowOffsetY = size * 0.06; }
  g.fillStyle = col; g.fillText(t, x, y); g.restore();
}
function panel(x, y, w, h, fill, stroke) { g.save(); g.fillStyle = fill; g.beginPath(); g.roundRect(x, y, w, h, 24); g.fill(); if (stroke) { g.strokeStyle = stroke; g.lineWidth = 2; g.stroke(); } g.restore(); }
function pill(x, y, w, h, fill, stroke) { g.save(); g.fillStyle = fill; g.beginPath(); g.roundRect(x, y, w, h, h / 2); g.fill(); if (stroke) { g.strokeStyle = stroke; g.lineWidth = 2; g.stroke(); } g.restore(); }

// Mundo partido: pinta `day` en todo, y `night` a la derecha de la línea.
function split(lineX, day, night) { day(); clipX(lineX, W, night); }

// ───── Escenas ─────
const scenes = {
  1() { // Gameplay premium
    const LX = 650, TOP = 520;
    split(LX, () => {
      const p = PAL.day; sky(p, 330, 150, false); hills(p, 400, 3, 4);
      ground(p, -10, 420, TOP); bridge(420, 650, TOP + 4); ground(p, 650, W + 10, TOP);
      seed = 21; [[70, 160], [230, 190], [360, 140], [840, 170], [1010, 150], [1180, 180]].forEach(([x, h]) => tree(x, TOP, h, p));
      [[120, '#ff7aa8'], [300, '#ffd35a'], [780, '#b28aff']].forEach(([x, col]) => { rect(x, TOP - 22, 3, 22, '#3fa857'); circle(x + 1, TOP - 24, 7, col); });
      pollen(0, LX, 120, 560, 120); butterfly(250, 330, '#ff9ec4'); butterfly(540, 280, '#ffd35a');
    }, () => {
      const p = PAL.night; sky(p, 1010, 150, true); hills(p, 400, 3, 4);
      ground(p, 650, W + 10, TOP);
      seed = 22; [[840, 200], [1010, 180], [1180, 210]].forEach(([x, h]) => tree(x, TOP, h, p, 1, true));
      iceSlab(700, 430, 120); iceSlab(880, 360, 120); iceSlab(1060, 300, 140);
      [[790, TOP], [930, TOP], [1100, TOP]].forEach(([x, y]) => { glow(x, y - 10, 40, 'rgba(120,160,255,0.9)'); circle(x, y - 12, 8, '#9db8ff'); rect(x - 2, y - 10, 4, 10, '#c9d6ff'); });
      fireflies(LX, W, 160, 560, 26);
      creature(1150, TOP - 70, 0.75, false);
    });
    moonShard(960, 250, 1);
    lumi(560, TOP - 62, 1.05, false, 1);
    seed = 31; for (let i = 0; i < 8; i++) circle(540 + R(-20, 50), TOP - R(0, 12), R(3, 7), 'rgba(255,255,255,0.55)');
    lineBeam(LX);
    bloomPass(); grade('#ffb070', 0.08); vignette(0.5);
    pill(28, 24, 330, 54, 'rgba(10,10,40,0.45)'); text('2 · Noche estrellada', 52, 51, 26);
    pill(W - 250, 24, 150, 54, 'rgba(10,10,40,0.45)'); moonShard(W - 218, 51, 0.6); text('1 / 3', W - 192, 52, 26, '#ffe8a0');
    pill(W - 86, 24, 58, 54, 'rgba(10,10,40,0.45)'); text('II', W - 57, 52, 24, '#fff', 'center');
    pill(28, H - 68, 210, 44, 'rgba(10,10,40,0.35)'); text('⏱ 0:42.18', 50, H - 46, 22, '#cfe0ff');
  },

  2() { // Tres capítulos
    rect(0, 0, W, H, lin(0, 0, 0, H, [[0, '#0b0a1c'], [1, '#191636']]));
    text('Tres capítulos, tres mundos', W / 2, 62, 40, '#fff', 'center');
    const cards = [
      ['I', 'La Pradera', PAL.day, PAL.night, 'flauta · marimba · grillos'],
      ['II', 'El Bosque Otoñal', PAL.autumn, PAL.autumnNight, 'guitarra · cuerdas · búhos'],
      ['III', 'La Cumbre Helada', PAL.snow, PAL.snowNight, 'campanas · coro · viento'],
    ];
    cards.forEach(([num, name, d, n, music], i) => {
      const x = 40 + i * 410, y = 110, w = 380, h = 520;

    // Lumi camina con el farol que tintinea
    lumi(420, TOP - 62, 1, false, 1);
    g.save(); g.strokeStyle = 'rgba(255,240,180,0.9)'; g.lineWidth = 2.5; [10, 18].forEach(r => { g.beginPath(); g.arc(470, TOP - 40, r, -0.8, 0.8); g.stroke(); }); g.restore();
    text('tin tin', 520, TOP - 70, 18, '#fff6d6', 'left', '400');
    // estornudo al entrar en la nieve
    lumi(860, TOP - 62, 1, true, 1);
    panel(880, 360, 180, 64, 'rgba(255,255,255,0.92)');
    text('¡Achís!', 970, 392, 28, '#3a2a60', 'center', '700', false);
    seed = 9; for (let i = 0; i < 10; i++) circle(920 + R(0, 50), TOP - 90 + R(-15, 15), R(2, 4), 'rgba(255,255,255,0.9)');
    lineBeam(LX); bloomPass(); vignette(0.45);
    label('Ideas 95, 123 y 126: el farol tintinea al caminar, Lumi estornuda al entrar en la nieve y las nubes tapan el sol');
  },
  51() { // Tanda A: logros con dibujo (69)
    rect(0, 0, W, H, lin(0, 0, 0, H, [[0, '#120f33'], [1, '#2a1f5e']]));
    text('Logros', 640, 80, 52, '#fff', 'center');
    const draw = [
      (x, y) => { circle(x, y, 22, '#ffe27a'); for (let a = 0; a < 8; a++) rect(x + Math.cos(a * 0.785) * 30 - 3, y + Math.sin(a * 0.785) * 30 - 3, 6, 6, '#ffe27a'); },
      (x, y) => { circle(x, y, 24, '#e8eeff'); circle(x + 10, y - 6, 22, '#2a2458'); },
      (x, y) => { poly([[x - 26, y + 18], [x, y - 26], [x + 26, y + 18]], '#7fdc6a'); rect(x - 4, y + 18, 8, 10, '#8a5a3a'); },
      (x, y) => { rect(x - 22, y - 14, 44, 30, '#c98a5a'); rect(x - 22, y - 14, 44, 8, '#e0a070'); circle(x, y + 2, 5, '#ffe27a'); },
      (x, y) => { rect(x - 2, y - 30, 4, 60, '#fff'); glow(x, y, 30, 'rgba(255,255,255,0.8)'); },
      (x, y) => { poly([[x - 18, y + 20], [x - 18, y - 20], [x + 20, y]], '#ff8a8a'); },
    ];
    const names = ['Primer amanecer', 'Noctámbulo', 'Pradera completa', 'Cazatesoros', 'Maestro de la línea', '???'];
    for (let i = 0; i < 6; i++) {
      const x = 260 + (i % 3) * 380, y = 230 + Math.floor(i / 3) * 230, got = i < 5;
      panel(x - 160, y - 80, 320, 180, got ? 'rgba(255,240,200,0.12)' : 'rgba(255,255,255,0.04)', got ? 'rgba(255,230,150,0.5)' : 'rgba(255,255,255,0.15)');
      circle(x, y - 10, 46, got ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.05)');
      g.save(); if (!got) g.globalAlpha = 0.3; draw[i](x, y - 10); g.restore();
      text(names[i], x, y + 65, 22, got ? '#fff' : '#8a86b8', 'center');
    }
    label('Idea 69: cada logro tiene su propio dibujo (sol, luna, árbol, cofre, línea...) en vez de una estrella genérica');
  },
};



function base(LX, TOP, d, n, sd) {
  split(LX, () => { sky(d, 300, 140, false); hills(d, 420, 3, sd); ground(d, -10, W + 10, TOP); seed = sd; for (let k = 0; k < 4; k++) tree(R(40, LX - 60), TOP, R(140, 200), d); },
    () => { sky(n, 1000, 150, true); hills(n, 420, 3, sd); ground(n, -10, W + 10, TOP); seed = sd + 1; for (let k = 0; k < 3; k++) tree(R(LX + 60, W), TOP, R(150, 210), n, 1, true); fireflies(LX, W, 200, 540, 18); });
}
function medal(x, y, col, name, got) { g.save(); g.globalAlpha = got ? 1 : 0.4; if (got) glow(x, y, 90, 'rgba(255,230,150,0.5)'); circle(x, y, 60, col); circle(x, y, 46, 'rgba(255,255,255,0.2)'); g.restore(); text(name, x, y + 90, 22, got ? '#fff' : '#8a8aa8', 'center'); }
function label(t) { pill(20, H - 50, Math.min(W - 40, t.length * 9.5 + 40), 36, 'rgba(0,0,0,0.55)'); text(t, 38, H - 32, 17, '#ffd98a', 'left', '400', false); }

function house(x, base, p) {
  const night = p === PAL.night;
  rect(x - 46, base - 80, 92, 80, night ? '#3a2f5a' : '#f2e2c8'); rect(x - 46, base - 80, 92, 8, night ? '#2a2246' : '#d9c4a2');
  poly([[x - 58, base - 78], [x, base - 132], [x + 58, base - 78]], night ? '#2a1f4a' : '#d9653a');
  rect(x - 12, base - 40, 24, 40, night ? '#1c1533' : '#8a5a3a');
  rect(x + 18, base - 66, 18, 18, night ? '#ffd36e' : '#9fd8ff'); if (night) glow(x + 27, base - 57, 50, 'rgba(255,210,110,0.9)');
}

(scenes[scene] || scenes[1])();
document.title = 'listo';
</script></body></html>
