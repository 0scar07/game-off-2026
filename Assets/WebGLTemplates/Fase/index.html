<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    /* El juego ocupa toda la ventana (también dentro del iframe de itch.io). */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0a1c; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #0b0a1c; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; color: #fff; font: 600 22px system-ui, sans-serif; letter-spacing: 6px; background: linear-gradient(90deg, #9ccbf0 50%, #0b0a1c 50%); }
    #loading span { mix-blend-mode: difference; }
    #bar { width: min(60vw, 360px); height: 8px; border-radius: 8px; background: rgba(255,255,255,.25); overflow: hidden; mix-blend-mode: difference; }
    #fill { width: 0; height: 100%; background: #fff; transition: width .2s; }
    /* En el móvil en vertical: pedir que lo giren. */
    #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0b0a1c; color: #fff; font: 600 20px system-ui, sans-serif;
      align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; flex-direction: column; gap: 16px; }
    #rotate .phone { width: 46px; height: 80px; border: 4px solid #fff; border-radius: 10px; animation: turn 1.6s ease-in-out infinite; }
    @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><span>FASE</span><div id="bar"><div id="fill"></div></div></div>
  <div id="rotate"><div class="phone"></div>Gira el móvil para jugar<br><small style="opacity:.7">Rotate your phone to play</small></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      arguments: [],
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // Nitidez en pantallas de alta densidad, con un límite para que vaya fluido en el móvil.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };
    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").remove();
        canvas.focus();
      }).catch(function (message) {
        document.querySelector("#loading span").textContent = "No se pudo cargar: " + message;
      });
    };
    document.body.appendChild(script);
    // Que el teclado llegue al juego aunque se haga clic fuera del lienzo dentro del iframe.
    window.addEventListener("pointerdown", function () { canvas.focus(); });
  </script>
</body>
</html>
